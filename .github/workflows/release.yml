name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: write
  repository-projects: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use a personal access token or GitHub App token with bypass permissions
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          # https://github.com/semantic-release/commit-analyzer/issues/65
          # https://github.com/romap0/semantic-release-unsquash/issues/7
          extra_plugins: |
            @semantic-release/changelog@latest
            @semantic-release/git@latest
            conventional-changelog-conventionalcommits@latest
        env:
          # Use the token with bypass permissions
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: v${{ needs.release.outputs.new_release_version }}

      # The archives are built on the lowest supported PHP version, so that
      # the bundled vendor/ directory is compatible with every supported one.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, wp-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # CI=true makes the Makefile use the tools installed on the runner
      # instead of Wokenv (see the "Tools" section of the Makefile).
      - name: Run Makefile 'install' task
        run: make install

      - name: Run Makefile 'crowdin-download' and 'mo' tasks
        run: make crowdin-download mo
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Run Makefile 'dist' task
        run: make dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          # https://github.com/softprops/action-gh-release
          # Note that if you intend to run workflows on the release event (on: { release: { types: [published] } }),
          # you need to use a personal access token for this action, as the default secrets.GITHUB_TOKEN does not trigger another workflow.
          # See: https://github.com/actions/create-release/issues/71
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}--with-git-updater.zip
          generate_release_notes: true

      - name: Store the WordPress.org archive
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-org
          path: dist/${{ github.event.repository.name }}.zip
          if-no-files-found: error

  deploy-svn:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    needs: [release, build]
    # Add required reviewers to this environment (Settings > Environments) to
    # hold the WordPress.org deployment until the GitHub release has been
    # verified. Without protection rules the job runs right after the build.
    environment: wordpress-org

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Download the WordPress.org archive
        uses: actions/download-artifact@v4
        with:
          name: wordpress-org
          path: dist

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Extract the archive
        run: unzip -q dist/${{ github.event.repository.name }}.zip -d dist/${{ github.event.repository.name }}

      - name: Run Makefile 'deploy-svn' task
        run: make deploy-svn VERSION=${{ needs.release.outputs.new_release_version }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
